spring:
  application:
    name: FuelNet

  datasource:
    url: ${DB_URL:jdbc:postgresql://ep-snowy-cake-adjc3va7-pooler.c-2.us-east-1.aws.neon.tech/neondb?sslmode=require}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD:npg_Cs2aOo5XFYRp}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update

app:
  jwt:
    # Must be at least 32 bytes. Override with JWT_SECRET in every real environment.
    secret: ${JWT_SECRET:change-me-fuelnet-dev-secret-key-must-be-32-bytes-min}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8000,https://fuel-net-frontend.vercel.app}
  seed:
    admin-email: ${SEED_ADMIN_EMAIL:admin@fuelnet.com}
    admin-password: ${SEED_ADMIN_PASSWORD:admin123}
  # Public site URL, used to build unsubscribe links in alert emails.
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
  alerts:
    # Safety-net sweep interval; alerts are also evaluated immediately on every price change.
    sweep-ms: ${ALERT_SWEEP_MS:900000}
  mail:
    from: ${MAIL_FROM:no-reply@fuelnet.local}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
