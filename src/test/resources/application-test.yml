spring:
  datasource:
    url: jdbc:h2:mem:fuelnet;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: test-secret-key-for-fuelnet-unit-tests-32-bytes-min
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:5173
  seed:
    admin-email: admin@fuelnet.com
    admin-password: admin123
